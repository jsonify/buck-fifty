# The Xcode project is generated from this file: `xcodegen generate` (brew install xcodegen). BuckFifty.xcodeproj
# and App/Info.plist are build outputs and not committed.
name: BuckFifty
options:
  bundleIdPrefix: com.jsonify
  # As in Meetball: Xcode 16.4 (iOS 18 SDK) builds it and runs it on newer phones.
  xcodeVersion: "16.4"
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  SK1Kit:
    url: https://github.com/jsonify/SK1Kit.git
    from: 0.4.1
  ShoppingKit:
    path: Packages/ShoppingKit
settings:
  base:
    # Your team, as in Meetball: Xcode and `make` builds sign with your Apple Development identity. CI builds
    # unsigned (CODE_SIGNING_ALLOWED=NO).
    DEVELOPMENT_TEAM: TS339TNM5P
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BuckFifty:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: SK1Kit
        product: SK1Tokens
      - package: SK1Kit
        product: SK1UI
      - package: ShoppingKit
        product: ShoppingCore
      - package: ShoppingKit
        product: ShoppingStore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Buck Fifty
        # The build number from the build settings, so the TestFlight workflow's CURRENT_PROJECT_VERSION (the commit
        # count) reaches the app. Without it XcodeGen writes a fixed "1", and App Store Connect refuses a second build 1.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Only standard encryption (HTTPS, iCloud), so TestFlight doesn't ask about export compliance on each build.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Accept CloudKit share invitations (a shared list).
        CKSharingSupported: true
        # Mapping the store from trips (issue #5, off unless turned on).
        NSMotionUsageDescription: Buck Fifty counts your steps and reads the compass during a trip to map where things are in the store. The map stays on your phone and in your shared list.
        # Trips by location (off unless turned on): a circle around each pinned store, watched with the app closed.
        NSLocationWhenInUseUsageDescription: Buck Fifty pins a store where you stand, so a trip can start as you arrive and end as you leave. Your location stays on your phone.
        NSLocationAlwaysAndWhenInUseUsageDescription: With Always, a trip ends as you leave the store even when Buck Fifty is closed, so one you forgot to end doesn't run on. Your location stays on your phone.
        # Silent pushes when another phone changes a shared list.
        UIBackgroundModes:
          - remote-notification
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jsonify.buckfifty
        CODE_SIGN_ENTITLEMENTS: App/BuckFifty.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        # The logo, in light, dark and tinted (App/Assets.xcassets, drawn by Scripts/make-icon.py).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The app's own code is warning-free. (Not passed on the command line: that would reach SK1Kit too, which
        # Xcode builds with warnings suppressed, and the two flags conflict.)
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
